name: Linux Installer Lifecycle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 deb, rpm, and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet and native packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils libgtk-4-dev libsecret-1-dev rpm
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build release artifacts
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rivet-linux-installers"
          mkdir -p "$root"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xFFFFFFFF
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)

          ihdr = struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0)
          idat = zlib.compress(b"\x00\x00\x00\x00\xff")
          Path("assets/icon.png").write_bytes(
              b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) +
              chunk(b"IDAT", idat) + chunk(b"IEND", b""))

          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace(
              '(resources . ())',
              '(resources . ("assets")) '
              '(linux-icon . "assets/icon.png") '
              '(linux-formats . ("deb" "rpm" "appimage"))')
          if updated == original:
              raise SystemExit("failed to configure Linux installer smoke")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet release --development --without-updates
          raco rivet verify
          artifacts="$RUNNER_TEMP/rivet-linux-native-artifacts"
          diagnostics="$RUNNER_TEMP/rivet-linux-build-diagnostics"
          mkdir -p "$artifacts" "$diagnostics"
          cp dist/*.deb dist/*.rpm dist/*.AppImage "$artifacts/"
          sha256sum "$artifacts"/* > "$diagnostics/SHA256SUMS"
          rpm -qpi "$artifacts"/*.rpm > "$diagnostics/rpm-info.txt"
          rpm -qp --requires "$artifacts"/*.rpm > "$diagnostics/rpm-requires.txt"
          raco rivet doctor --json > "$diagnostics/doctor.json"
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: linux-native-installers
          path: ${{ runner.temp }}/rivet-linux-native-artifacts
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-native-build-diagnostics
          path: ${{ runner.temp }}/rivet-linux-build-diagnostics
          if-no-files-found: warn

  appimage-wayland:
    name: AppImage launch on Ubuntu 24.04 Wayland
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-native-installers
          path: ${{ runner.temp }}/installers
      - name: Install headless Wayland compositor
        run: |
          sudo apt-get update
          sudo apt-get install --yes weston
      - name: Launch AppImage outside the build tree
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/rivet-appimage-diagnostics"
          mkdir -p "$diagnostics"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/rivet-appimage-runtime"
          export WAYLAND_DISPLAY=wayland-rivet-appimage
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          appimage="$(find "$RUNNER_TEMP/installers" -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          trap - EXIT
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
      - name: Upload AppImage diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-appimage-wayland-diagnostics
          path: ${{ runner.temp }}/rivet-appimage-diagnostics
          if-no-files-found: warn

  debian-deb-wayland:
    name: deb install and launch on Debian 13 Wayland
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:13
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-native-installers
          path: /tmp/rivet-installers
      - name: Install desktop runtime
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes \
            dbus-daemon desktop-file-utils libgtk-4-1 libsecret-1-0 \
            procps weston
      - name: Install, launch, and uninstall deb
        shell: bash
        run: |
          set -euo pipefail
          diagnostics=/tmp/rivet-debian-diagnostics
          mkdir -p "$diagnostics"
          deb_artifact="$(find /tmp/rivet-installers -type f -name '*.deb' -print -quit)"
          test -n "$deb_artifact"
          deb_package="$(dpkg-deb --field "$deb_artifact" Package)"
          test -n "$deb_package"
          apt-get install --yes "$deb_artifact" >"$diagnostics/apt-install.log" 2>&1
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' \
            "$deb_package" >"$diagnostics/installed-version.txt"
          test -x /opt/Smoke/RivetHost
          test -f /usr/share/applications/Smoke.desktop
          test -f /usr/share/pixmaps/Smoke.png
          desktop-file-validate /usr/share/applications/Smoke.desktop
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource

          export XDG_RUNTIME_DIR=/tmp/rivet-debian-wayland-runtime
          export WAYLAND_DISPLAY=wayland-rivet-debian
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            apt-get remove --yes "$deb_package" \
              >>"$diagnostics/apt-remove.log" 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /opt/Smoke/RivetHost >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          apt-get remove --yes "$deb_package" >"$diagnostics/apt-remove.log" 2>&1
          test ! -e /opt/Smoke/RivetHost
          test ! -e /usr/share/applications/Smoke.desktop
          test ! -e /usr/share/pixmaps/Smoke.png
          trap - EXIT
      - name: Upload Debian diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debian-deb-wayland-diagnostics
          path: /tmp/rivet-debian-diagnostics
          if-no-files-found: warn

  fedora-rpm-wayland:
    name: rpm install and launch on Fedora 44 Wayland
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: fedora:44
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-native-installers
          path: /tmp/rivet-installers
      - name: Install desktop runtime
        run: dnf install --assumeyes dbus-daemon desktop-file-utils gtk4 procps-ng weston
      - name: Install, launch, and uninstall rpm
        shell: bash
        run: |
          set -euo pipefail
          diagnostics=/tmp/rivet-fedora-diagnostics
          mkdir -p "$diagnostics"
          rpm_artifact="$(find /tmp/rivet-installers -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_artifact"
          rpm_package="$(rpm -qp --qf '%{NAME}' "$rpm_artifact")"
          test -n "$rpm_package"
          dnf install --assumeyes "$rpm_artifact" >"$diagnostics/dnf-install.log" 2>&1
          rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm_package" \
            >"$diagnostics/installed-version.txt"
          test -x /opt/Smoke/RivetHost
          test -f /usr/share/applications/Smoke.desktop
          test -f /usr/share/pixmaps/Smoke.png
          desktop-file-validate /usr/share/applications/Smoke.desktop
          test "$(cat /opt/Smoke/app/assets/nested/product.txt)" = packaged-resource

          export XDG_RUNTIME_DIR=/tmp/rivet-fedora-wayland-runtime
          export WAYLAND_DISPLAY=wayland-rivet-fedora
          export GDK_BACKEND=wayland
          unset DISPLAY
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            --log="$diagnostics/weston.log" &
          weston_pid=$!
          app_pid=""
          stop_bounded() {
            local pid="$1"
            local label="$2"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 200); do
              kill -0 "$pid" 2>/dev/null || return 0
              sleep 0.05
            done
            kill -KILL "$pid" 2>/dev/null || true
            echo "$label did not stop within ten seconds of SIGTERM" >&2
            return 1
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              stop_bounded "$app_pid" application || status=1
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            dnf remove --assumeyes "$rpm_package" >>"$diagnostics/dnf-remove.log" 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$diagnostics/weston.log"
              exit 1
            }
            sleep 0.05
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /opt/Smoke/RivetHost >"$diagnostics/application.log" 2>&1 &
          app_pid=$!
          for _ in $(seq 1 50); do
            kill -0 "$app_pid" 2>/dev/null || {
              wait "$app_pid" || true
              cat "$diagnostics/application.log"
              exit 1
            }
            sleep 0.1
          done
          stop_bounded "$app_pid" application
          wait "$app_pid" || test "$?" -eq 143
          app_pid=""
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          dnf remove --assumeyes "$rpm_package" >"$diagnostics/dnf-remove.log" 2>&1
          test ! -e /opt/Smoke/RivetHost
          test ! -e /usr/share/applications/Smoke.desktop
          test ! -e /usr/share/pixmaps/Smoke.png
          trap - EXIT
      - name: Upload Fedora diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fedora-rpm-wayland-diagnostics
          path: /tmp/rivet-fedora-diagnostics
          if-no-files-found: warn
