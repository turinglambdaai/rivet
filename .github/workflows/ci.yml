name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  racket:
    name: Racket core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test
        run: raco test tests/
      - name: Check CLI
        run: raco rivet help
      - name: Check release metadata and source package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^(define version "\([^"]*\)")/\1/p' info.rkt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "info.rkt version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          grep -Fxq "## $version" CHANGELOG.md
          package_dir="$RUNNER_TEMP/rivet-package"
          mkdir -p "$package_dir"
          raco pkg create --from-dir --source --format zip --dest "$package_dir" "$PWD"
          find "$package_dir" -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .

  native-protocol:
    name: Native protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S runtime -B build/native -DRIVET_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

  swift-runtime:
    name: Swift protocol/runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Test Swift runtime and C bridge
        shell: bash
        run: |
          set -euo pipefail
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          swift test --package-path platform/macos -Xcc "-I${racket_include}"

  windows-host:
    name: Windows CLI package smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain
        shell: pwsh
        run: raco rivet doctor
      - name: Scaffold, build, and package WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          raco rivet build
          raco rivet package
          if (-not (Test-Path 'dist\Smoke-windows-x64\RivetHost.exe')) {
            throw 'packaged WinUI executable was not produced'
          }

  macos-host:
    name: macOS CLI package smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain
        run: raco rivet doctor
      - name: Scaffold, build, and package SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          raco rivet build
          raco rivet package
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          codesign --verify --deep --strict dist/Smoke.app
