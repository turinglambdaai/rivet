name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  racket:
    name: Racket core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test
        run: raco test tests/
      - name: Check CLI
        run: raco rivet help

  native-protocol:
    name: Native protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S runtime -B build/native -DRIVET_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

  swift-runtime:
    name: Swift protocol/runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Test Swift runtime and C bridge
        shell: bash
        run: |
          set -euo pipefail
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          swift test --package-path platform/macos -Xcc "-I${racket_include}"

  macos-roundtrip:
    name: macOS embedded Racket round trip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build backend and integration runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rivet-roundtrip"
          mkdir -p "$stage/res" "$stage/runtime"
          raco ctool \
            --runtime "$stage/runtime" \
            --runtime-access runtime \
            --mods "$stage/res/core.zo" \
            platform/macos/Integration/backend.rkt

          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_lib="$(racket -e '(require setup/dirs) (display (path->string (find-lib-dir)))')"
          swift build \
            --package-path platform/macos \
            --scratch-path "$RUNNER_TEMP/rivet-swift-integration" \
            -c release \
            --product RivetIntegration \
            -Xcc "-I${racket_include}" \
            -Xlinker "-F${racket_lib}" \
            -Xlinker -framework \
            -Xlinker Racket \
            -Xlinker -rpath \
            -Xlinker "$racket_lib"

          swift_bin="$(swift build --package-path platform/macos --scratch-path "$RUNNER_TEMP/rivet-swift-integration" -c release --show-bin-path)"
          cp "$swift_bin/RivetIntegration" "$stage/RivetIntegration"
          chmod +x "$stage/RivetIntegration"

          echo "RIVET_ROUNDTRIP_STAGE=$stage" >> "$GITHUB_ENV"
          echo "RIVET_TEST_EXECUTABLE=$stage/RivetIntegration" >> "$GITHUB_ENV"
          echo "RIVET_TEST_CORE=$stage/res/core.zo" >> "$GITHUB_ENV"
          echo "RIVET_TEST_PETITE_BOOT=$(find /Applications/Racket -name petite.boot -type f | head -n 1)" >> "$GITHUB_ENV"
          echo "RIVET_TEST_SCHEME_BOOT=$(find /Applications/Racket -name scheme.boot -type f | head -n 1)" >> "$GITHUB_ENV"
          echo "RIVET_TEST_RACKET_BOOT=$(find /Applications/Racket -name racket.boot -type f | head -n 1)" >> "$GITHUB_ENV"
      - name: Exercise embedded runtime
        run: "$RIVET_ROUNDTRIP_STAGE/RivetIntegration"

  windows-host:
    name: Windows CLI package smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain
        shell: pwsh
        run: raco rivet doctor
      - name: Scaffold and package WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          raco rivet package
          if (-not (Test-Path 'dist\Smoke-windows-x64\RivetHost.exe')) {
            throw 'packaged WinUI executable was not produced'
          }

  macos-host:
    name: macOS CLI package smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain
        run: raco rivet doctor
      - name: Scaffold and package SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          raco rivet package
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          codesign --verify --deep --strict dist/Smoke.app
