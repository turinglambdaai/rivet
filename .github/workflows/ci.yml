name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  racket:
    name: Racket core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Test
        run: raco test tests/
      - name: Check CLI
        run: raco rivet help
      - name: Check release metadata and source package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^(define version "\([^"]*\)")/\1/p' info.rkt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "info.rkt version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          grep -Fxq "## $version" CHANGELOG.md
          package_dir="$RUNNER_TEMP/rivet-package"
          mkdir -p "$package_dir"
          raco pkg create --from-dir --source --format zip --dest "$package_dir" "$PWD"
          find "$package_dir" -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .

  native-protocol:
    name: Native protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S runtime -B build/native -DRIVET_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure

  dotnet-runtime:
    name: .NET protocol/runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build managed runtime
        run: dotnet build platform/dotnet/Rivet.Runtime/Rivet.Runtime.csproj -c Release
      - name: Run managed protocol smoke
        run: dotnet run --project platform/dotnet/Rivet.Runtime.Smoke/Rivet.Runtime.Smoke.csproj -c Release
      - name: Compile primitive generated C# client
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cat > app/backend.rkt <<'RKT'
          #lang racket/base
          (require rivet/backend)
          (provide start)
          (define-state counter : Int64 0)
          (define-rpc (greet [name String] : String)
            (format "Hello, ~a!" name))
          (define (start in-fd out-fd)
            (serve-fds in-fd out-fd))
          RKT
          raco rivet generate-dotnet
          cat > dotnet/GeneratedSmoke.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/platform/dotnet/Rivet.Runtime/Rivet.Runtime.csproj" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build dotnet/GeneratedSmoke.csproj -c Release

  swift-runtime:
    name: Swift protocol/runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Test Swift runtime and C bridge
        shell: bash
        run: |
          set -euo pipefail
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          swift test --package-path platform/macos -Xcc "-I${racket_include}"

  windows-host:
    name: Windows CLI package + embedded .NET smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain and JSON diagnostics
        shell: pwsh
        run: |
          raco rivet doctor
          $json = raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'raco rivet doctor --json failed' }
          $report = $json | ConvertFrom-Json
          if (-not $report.usable) { throw 'doctor JSON did not report a usable Windows toolchain' }
          if (-not $report.runtime.'petite-boot') { throw 'doctor JSON omitted the selected petite.boot' }
          if (-not $report.runtime.'racketcs-dll') { throw 'doctor JSON omitted the selected Racket CS DLL' }
      - name: Compile full schema matrix, package, verify, and clean WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\schema-matrix-backend.rkt') 'app\backend.rkt' -Force
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(windows-min-version . "10.0.19041.0")', '(windows-min-version . "10.0.19045.0")')
          if ($updated -eq $config) { throw 'failed to customize windows-min-version smoke value' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          raco rivet build
          raco rivet package
          raco rivet verify
          if (-not (Test-Path 'dist\Smoke-windows-x64\RivetHost.exe')) {
            throw 'packaged WinUI executable was not produced'
          }
          raco rivet clean
          foreach ($path in @('.rivet', 'build', 'dist')) {
            if (Test-Path $path) { throw "raco rivet clean left generated path: $path" }
          }
          if (-not (Test-Path 'app\backend.rkt')) {
            throw 'raco rivet clean removed application source'
          }
      - name: Build embedded .NET runtime bundle with SQLite and blocking FFI
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-dotnet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new EmbeddedSmoke
          Set-Location (Join-Path $root 'EmbeddedSmoke')
          @'
          #lang racket/base

          (require db
                   ffi/unsafe
                   (only-in db/private/sqlite3/ffi sqlite3_libversion_number)
                   rivet/backend)

          (provide start)

          (define-state counter : Int64 0)

          (define kernel32 (ffi-lib "kernel32"))
          (define win-sleep
            (get-ffi-obj "Sleep" kernel32 (_fun _uint32 -> _void)))
          (define win-sleep/blocking
            (get-ffi-obj "Sleep" kernel32 (_fun #:blocking? #t _uint32 -> _void)))

          (define-rpc (greet [name String] : String)
            (format "Hello, ~a!" name))

          (define-rpc (scheduler-yield : String)
            (sleep 0.001)
            "scheduler-ok")

          (define-rpc (ffi-nonblocking : String)
            (win-sleep 1)
            "ffi-nonblocking-ok")

          (define-rpc (sqlite-version : String)
            (number->string (sqlite3_libversion_number)))

          (define-rpc (ffi-blocking : String)
            (win-sleep/blocking 1)
            "ffi-blocking-ok")

          (define-rpc (sqlite-roundtrip [value String] : String)
            (define conn (sqlite3-connect #:database 'memory))
            (dynamic-wind
             void
             (lambda ()
               (query-exec conn "CREATE TABLE smoke (value TEXT NOT NULL)")
               (query-exec conn "INSERT INTO smoke (value) VALUES (?)" value)
               (query-value conn "SELECT value FROM smoke LIMIT 1"))
             (lambda ()
               (disconnect conn))))

          (define (start in-fd out-fd)
            (serve-fds in-fd out-fd))
          '@ | Set-Content -Path 'app\backend.rkt'
          raco rivet build-dotnet
          $stage = '.rivet\dotnet\windows-x64'
          if (-not (Test-Path "$stage\rivet_native.dll")) {
            throw 'rivet_native.dll was not produced'
          }
          if (-not (Test-Path "$stage\res\core.zo")) {
            throw 'compiled Racket backend was not staged'
          }
          if (-not (Test-Path "$stage\runtime\racket.boot")) {
            throw 'Racket boot files were not staged'
          }
          if (-not (Test-Path "$stage\runtime\sqlite3.dll")) {
            throw 'Racket SQLite foreign library was not staged'
          }
          if (-not (Test-Path 'dotnet\GeneratedBackend.cs')) {
            throw 'typed C# client was not generated'
          }
      - name: Run Racket in-process from .NET without runtime PATH mutation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-dotnet-smoke\EmbeddedSmoke'
          $dotnet = Join-Path $root 'dotnet'
          $project = Join-Path $dotnet 'EmbeddedSmoke.csproj'
          $program = Join-Path $dotnet 'Program.cs'
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$env:GITHUB_WORKSPACE\platform\dotnet\Rivet.Runtime\Rivet.Runtime.csproj" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Path $project
          @'
          using Rivet.Runtime;
          using EmbeddedSmoke.RivetGenerated;

          if (args.Length != 1) throw new InvalidOperationException("runtime root missing");
          await using var client = await EmbeddedRivetClient.StartAsync(new EmbeddedRivetOptions(args[0]));
          var api = new RivetAPI(client);

          Console.WriteLine("phase:greet:start");
          var greeting = await api.GreetAsync("Taskly");
          if (greeting != "Hello, Taskly!") throw new InvalidOperationException($"unexpected greeting: {greeting}");
          Console.WriteLine("phase:greet:done");

          var before = await api.GetCounterAsync();
          var after = await api.SetCounterAsync(before + 1);
          if (after != before + 1) throw new InvalidOperationException("state round-trip failed");
          Console.WriteLine("phase:state:done");

          Console.WriteLine("phase:scheduler:start");
          var scheduler = await api.SchedulerYieldAsync();
          if (scheduler != "scheduler-ok") throw new InvalidOperationException($"unexpected scheduler result: {scheduler}");
          Console.WriteLine("phase:scheduler:done");

          Console.WriteLine("phase:ffi-nonblocking:start");
          var ffiNonblocking = await api.FfiNonblockingAsync();
          if (ffiNonblocking != "ffi-nonblocking-ok") throw new InvalidOperationException($"unexpected FFI result: {ffiNonblocking}");
          Console.WriteLine("phase:ffi-nonblocking:done");

          Console.WriteLine("phase:sqlite-version:start");
          var sqliteVersion = await api.SqliteVersionAsync();
          if (string.IsNullOrWhiteSpace(sqliteVersion)) throw new InvalidOperationException("SQLite version was empty");
          Console.WriteLine($"phase:sqlite-version:done:{sqliteVersion}");

          Console.WriteLine("phase:ffi-blocking:start");
          var ffiBlocking = await api.FfiBlockingAsync();
          if (ffiBlocking != "ffi-blocking-ok") throw new InvalidOperationException($"unexpected blocking FFI result: {ffiBlocking}");
          Console.WriteLine("phase:ffi-blocking:done");

          Console.WriteLine("phase:sqlite-roundtrip:start");
          var sqlite = await api.SqliteRoundtripAsync("sqlite-ok");
          if (sqlite != "sqlite-ok") throw new InvalidOperationException($"unexpected SQLite result: {sqlite}");
          Console.WriteLine("phase:sqlite-roundtrip:done");
          Console.WriteLine("Embedded Rivet .NET + FFI + SQLite smoke passed.");
          '@ | Set-Content -Path $program
          $stage = (Resolve-Path (Join-Path $root '.rivet\dotnet\windows-x64')).Path
          # The stage root is added only so NativeLibrary can locate rivet_native.dll.
          # runtime/ itself is intentionally NOT added to PATH: the native bridge
          # must resolve bundled SQLite/FFI dependencies without host mutation.
          $env:PATH = "$stage;$env:PATH"
          dotnet run --project $project -c Release -- $stage

  macos-host:
    name: macOS CLI package smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain and JSON diagnostics
        shell: bash
        run: |
          set -euo pipefail
          raco rivet doctor
          report="$RUNNER_TEMP/rivet-doctor.json"
          raco rivet doctor --json > "$report"
          python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["usable"] is True
          assert report["runtime"]["petite-boot"]
          assert report["runtime"]["racket-framework"]
          assert report["tools"]["plutil"]
          PY
      - name: Compile full schema matrix, package, verify, and clean SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(macos-min-version . "14.0")', '(macos-min-version . "14.1")')
          if updated == original:
              raise SystemExit("failed to customize macos-min-version smoke value")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet build
          raco rivet package
          raco rivet verify
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          codesign --verify --deep --strict dist/Smoke.app
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/Smoke.app/Contents/Info.plist)" = "14.1"
          raco rivet clean
          test ! -e .rivet
          test ! -e build
          test ! -e dist
          test -f app/backend.rkt