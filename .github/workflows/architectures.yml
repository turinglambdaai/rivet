name: Desktop Architectures

# Clean-runner build/package/verify evidence for every advertised desktop
# architecture beyond the primary x64/Apple-Silicon entries in ci.yml:
# Windows ARM64, macOS Intel, and Linux AArch64.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architectures-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    name: Windows ARM64 CLI package smoke
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket CS 9.3 (arm64, checksum-pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'racket-9.3-arm64-win32-cs.exe'
          Invoke-WebRequest `
            -Uri 'https://download.racket-lang.org/installers/9.3/racket-9.3-arm64-win32-cs.exe' `
            -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '15cd4ace652427465c7c576bad4aede2b8519cb6b59b190c9a22862cf57e7924') {
            throw "Racket 9.3 arm64 installer checksum mismatch: $hash"
          }
          # NSIS silent install; /D must be last and unquoted. On Windows the
          # Racket executables (racket.exe, raco.exe) live in the install root,
          # not a bin/ directory.
          Start-Process -FilePath $installer -ArgumentList '/S','/D=C:\Racket' -Wait -NoNewWindow
          if (-not (Test-Path 'C:\Racket\racket.exe')) {
            throw 'Racket arm64 silent install did not produce C:\Racket\racket.exe'
          }
          Add-Content $env:GITHUB_PATH 'C:\Racket'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain and JSON diagnostics
        shell: pwsh
        run: |
          raco rivet doctor
          $json = raco rivet doctor --json
          if ($LASTEXITCODE -ne 0) { throw 'raco rivet doctor --json failed' }
          $report = $json | ConvertFrom-Json
          if (-not $report.usable) { throw 'doctor JSON did not report a usable Windows ARM64 toolchain' }
          if (-not $report.runtime.'petite-boot') { throw 'doctor JSON omitted the selected petite.boot' }
          if (-not $report.runtime.'racketcs-dll') { throw 'doctor JSON omitted the selected Racket CS DLL' }
      - name: Compile full schema matrix, package, verify, and clean WinUI app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rivet-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Location $root
          raco rivet new Smoke
          Set-Location (Join-Path $root 'Smoke')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\schema-matrix-backend.rkt') 'app\backend.rkt' -Force
          New-Item -ItemType Directory -Force -Path 'assets\nested' | Out-Null
          Set-Content -Path 'assets\nested\product.txt' -Value 'packaged-resource' -NoNewline
          $config = Get-Content 'rivet.rktd' -Raw
          $updated = $config.Replace('(resources . ())', '(resources . ("assets"))').Replace('(windows-min-version . "10.0.19041.0")', '(windows-min-version . "10.0.19045.0")')
          if ($updated -eq $config) { throw 'failed to customize windows-min-version smoke value' }
          Set-Content -Path 'rivet.rktd' -Value $updated -NoNewline
          raco rivet build
          raco rivet package
          raco rivet verify
          if (-not (Test-Path 'dist\Smoke-windows-ARM64\RivetHost.exe')) {
            throw 'packaged WinUI ARM64 executable was not produced'
          }
          if ((Get-Content 'dist\Smoke-windows-ARM64\app\assets\nested\product.txt' -Raw) -ne 'packaged-resource') {
            throw 'configured application resource was not preserved in the Windows ARM64 package'
          }
          raco rivet clean
          foreach ($path in @('.rivet', 'build', 'dist')) {
            if (Test-Path $path) { throw "raco rivet clean left generated path: $path" }
          }
          if (-not (Test-Path 'app\backend.rkt')) {
            throw 'raco rivet clean removed application source'
          }

  macos-intel:
    name: macOS Intel CLI package smoke
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Check toolchain and JSON diagnostics
        shell: bash
        run: |
          set -euo pipefail
          raco rivet doctor
          report="$RUNNER_TEMP/rivet-doctor.json"
          raco rivet doctor --json > "$report"
          python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert report["usable"] is True
          assert report["runtime"]["petite-boot"]
          assert report["runtime"]["racket-framework"]
          assert report["tools"]["plutil"]
          PY
      - name: Compile full schema matrix, package, verify, and clean SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())', '(resources . ("assets"))').replace('(macos-min-version . "14.0")', '(macos-min-version . "14.1")')
          if updated == original:
              raise SystemExit("failed to customize macos-min-version smoke value")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet build
          raco rivet package
          raco rivet verify
          test -x dist/Smoke.app/Contents/MacOS/Smoke
          test "$(uname -m)" = x86_64
          test "$(file dist/Smoke.app/Contents/MacOS/Smoke | grep -c x86_64)" -gt 0
          test "$(cat dist/Smoke.app/Contents/Resources/app/assets/nested/product.txt)" = packaged-resource
          codesign --verify --deep --strict dist/Smoke.app
          test "$(plutil -extract LSMinimumSystemVersion raw -o - dist/Smoke.app/Contents/Info.plist)" = "14.1"
          raco rivet clean
          test ! -e .rivet
          test ! -e build
          test ! -e dist
          test -f app/backend.rkt

  linux-arm64:
    name: Linux ARM64 CLI package smoke
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: ./.github/actions/setup-embed-racket
      - name: Install Rivet
        shell: bash
        run: |
          set -euo pipefail
          raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev
      - name: Compile full schema matrix, package, and verify a GTK4 app
        shell: bash
        run: |
          set -euo pipefail
          export RIVET_ROOT="$GITHUB_WORKSPACE"

          raco rivet doctor
          root="$(mktemp -d)"
          cd "$root"
          raco rivet new Smoke
          cd Smoke
          cp "$GITHUB_WORKSPACE/tests/fixtures/schema-matrix-backend.rkt" app/backend.rkt
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())', '(resources . ("assets"))')
          if updated == original:
              raise SystemExit("failed to configure Linux ARM64 smoke resource")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet build
          test -x .rivet/stage/RivetHost
          raco rivet package
          raco rivet verify
          test -x dist/Smoke-linux-arm64/RivetHost
          test "$(cat dist/Smoke-linux-arm64/app/assets/nested/product.txt)" = packaged-resource
          file dist/Smoke-linux-arm64/RivetHost | grep -q aarch64
