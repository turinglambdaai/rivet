name: Embedded Roundtrip

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-roundtrip-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-roundtrip:
    name: Linux embedded Racket round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Install system adapter development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev libsecret-1-dev
      - name: Cache embeddable Racket CS
        id: cache-racket-embed
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build backend and integration runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rivet-linux-roundtrip"
          native_build="$RUNNER_TEMP/rivet-linux-native-integration"
          embed_prefix="$RUNNER_TEMP/racket-embed"
          mkdir -p "$stage/res" "$stage/runtime"

          raco ctool \
            --runtime "$stage/runtime" \
            --runtime-access runtime \
            --mods "$stage/res/core.zo" \
            platform/linux/Integration/backend.rkt

          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          runtime_roots=("$embed_prefix")
          petite_source="$(find "${runtime_roots[@]}" -maxdepth 6 -name petite.boot -print -quit)"
          scheme_source="$(find "${runtime_roots[@]}" -maxdepth 6 -name scheme.boot -print -quit)"
          racket_boot_source="$(find "${runtime_roots[@]}" -maxdepth 6 -name racket.boot -print -quit)"
          if [[ -z "$petite_source" || -z "$scheme_source" || -z "$racket_boot_source" ]]; then
            echo "Racket CS boot files were not found" >&2
            find "${runtime_roots[@]}" -maxdepth 6 \
              \( -name '*.boot' -o -name '*racketcs*' \) -print >&2
            exit 1
          fi
          cp "$petite_source" "$stage/runtime/petite.boot"
          cp "$scheme_source" "$stage/runtime/scheme.boot"
          cp "$racket_boot_source" "$stage/runtime/racket.boot"

          racket_library="$(find "${runtime_roots[@]}" -maxdepth 6 \
            -name 'libracketcs*.a' \
            -print -quit)"
          if [[ -z "$racket_library" ]]; then
            echo "No embeddable Racket CS library found" >&2
            find "${runtime_roots[@]}" -maxdepth 6 -name '*racketcs*' -print >&2
            exit 1
          fi

          cmake -S platform/linux/Integration -B "$native_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DRIVET_ROOT="$GITHUB_WORKSPACE" \
            -DRIVET_RACKET_INCLUDE="$racket_include" \
            -DRIVET_RACKET_LIBRARY="$racket_library"
          cmake --build "$native_build" --config Release
          cp "$native_build/RivetIntegration" "$stage/RivetIntegration"
          chmod +x "$stage/RivetIntegration"

          echo "RIVET_LINUX_ROUNDTRIP_STAGE=$stage" >> "$GITHUB_ENV"
          echo "RIVET_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIB_DIR=$(dirname "$racket_library")" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$racket_library" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_BOOT_DIR=$stage/runtime" >> "$GITHUB_ENV"
      - name: Exercise embedded runtime
        timeout-minutes: 2
        run: "$RIVET_LINUX_ROUNDTRIP_STAGE/RivetIntegration"
      - name: Exercise Linux system adapter
        timeout-minutes: 2
        # Notification and Secret Service checks skip themselves on a runner
        # without a session bus; single-instance, autostart, and the crash
        # hook always run.
        run: '"$RIVET_LINUX_ROUNDTRIP_STAGE/RivetIntegration" --system ci ci'
      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev
      - name: Build, package, and verify a generated GTK4 app
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          cd "$root"
          raco rivet doctor
          raco rivet new Smoke
          cd Smoke
          mkdir -p assets/nested
          printf %s packaged-resource > assets/nested/product.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("rivet.rktd")
          original = path.read_text(encoding="utf-8")
          updated = original.replace('(resources . ())', '(resources . ("assets"))')
          if updated == original:
              raise SystemExit("failed to configure Linux smoke resource")
          path.write_text(updated, encoding="utf-8")
          PY
          raco rivet build
          test -x .rivet/stage/RivetHost
          test "$(cat .rivet/stage/app/assets/nested/product.txt)" = packaged-resource
          grep -Fq 'rivet::linux_runtime::Backend' linux/GeneratedBackend.hpp
          raco rivet package
          raco rivet verify
          test -x dist/Smoke-linux-x64/RivetHost
          test "$(cat dist/Smoke-linux-x64/app/assets/nested/product.txt)" = packaged-resource

  macos-roundtrip:
    name: macOS embedded Racket round trip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build backend and integration runner
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rivet-roundtrip"
          framework_dir="$stage/Frameworks"
          mkdir -p "$stage/res" "$stage/runtime" "$framework_dir"

          raco ctool \
            --runtime "$stage/runtime" \
            --runtime-access runtime \
            --mods "$stage/res/core.zo" \
            platform/macos/Integration/backend.rkt

          petite_source="$(find /Applications/Racket -name petite.boot -type f | head -n 1)"
          scheme_source="$(find /Applications/Racket -name scheme.boot -type f | head -n 1)"
          racket_boot_source="$(find /Applications/Racket -name racket.boot -type f | head -n 1)"
          test -n "$petite_source"
          test -n "$scheme_source"
          test -n "$racket_boot_source"
          cp "$petite_source" "$stage/runtime/petite.boot"
          cp "$scheme_source" "$stage/runtime/scheme.boot"
          cp "$racket_boot_source" "$stage/runtime/racket.boot"

          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_lib="$(racket -e '(require setup/dirs) (display (path->string (find-lib-dir)))')"
          source_framework="$racket_lib/Racket.framework"
          test -d "$source_framework"
          ditto "$source_framework" "$framework_dir/Racket.framework"

          versions="$framework_dir/Racket.framework/Versions"
          version_path="$(find "$versions" -mindepth 1 -maxdepth 1 -type d -name '*_CS' | head -n 1)"
          test -n "$version_path"
          version_name="$(basename "$version_path")"
          ln -sfn "$version_name" "$versions/Current"
          ln -sfn "Versions/Current/Racket" "$framework_dir/Racket.framework/Racket"
          install_name_tool -id \
            "@rpath/Racket.framework/Versions/$version_name/Racket" \
            "$version_path/Racket"

          export RIVET_ROOT="$GITHUB_WORKSPACE"
          export RIVET_RACKET_FRAMEWORK_DIR="$framework_dir"
          swift build \
            --package-path platform/macos/Integration \
            --scratch-path "$RUNNER_TEMP/rivet-swift-integration" \
            -c release \
            -Xcc "-I${racket_include}" \
            -Xlinker -rpath \
            -Xlinker "@executable_path/Frameworks"

          swift_bin="$(swift build \
            --package-path platform/macos/Integration \
            --scratch-path "$RUNNER_TEMP/rivet-swift-integration" \
            -c release --show-bin-path)"
          cp "$swift_bin/RivetIntegration" "$stage/RivetIntegration"
          chmod +x "$stage/RivetIntegration"

          echo "RIVET_ROUNDTRIP_STAGE=$stage" >> "$GITHUB_ENV"
          echo "RIVET_TEST_EXECUTABLE=$stage/RivetIntegration" >> "$GITHUB_ENV"
          echo "RIVET_TEST_CORE=$stage/res/core.zo" >> "$GITHUB_ENV"
          echo "RIVET_TEST_PETITE_BOOT=$stage/runtime/petite.boot" >> "$GITHUB_ENV"
          echo "RIVET_TEST_SCHEME_BOOT=$stage/runtime/scheme.boot" >> "$GITHUB_ENV"
          echo "RIVET_TEST_RACKET_BOOT=$stage/runtime/racket.boot" >> "$GITHUB_ENV"
      - name: Exercise embedded runtime
        timeout-minutes: 2
        run: "$RIVET_ROUNDTRIP_STAGE/RivetIntegration"
      - name: Record embedded benchmark (informational)
        timeout-minutes: 2
        run: |
          "$RIVET_ROUNDTRIP_STAGE/RivetIntegration" --benchmark

  windows-roundtrip:
    name: Windows embedded Racket round trip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        shell: pwsh
        run: raco pkg install --auto --no-docs --name rivet --link "$PWD"
      - name: Build integration backend and host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'rivet-roundtrip'
          $runtime = Join-Path $stage 'runtime'
          $res = Join-Path $stage 'res'
          $nativeBuild = Join-Path $env:RUNNER_TEMP 'rivet-native-integration'
          New-Item -ItemType Directory -Force -Path $runtime, $res | Out-Null

          raco ctool `
            --runtime $runtime `
            --runtime-access runtime `
            --mods (Join-Path $res 'core.zo') `
            platform/windows/Integration/backend.rkt

          $racketExe = (Get-Command racket.exe).Source
          $racketRoot = Split-Path $racketExe -Parent
          $include = Join-Path $racketRoot 'include'
          $petite = Get-ChildItem $racketRoot -Recurse -File -Filter petite.boot | Select-Object -First 1
          $scheme = Get-ChildItem $racketRoot -Recurse -File -Filter scheme.boot | Select-Object -First 1
          $racketBoot = Get-ChildItem $racketRoot -Recurse -File -Filter racket.boot | Select-Object -First 1
          $dll = Get-ChildItem $racketRoot -Recurse -File -Filter 'libracketcs*.dll' | Select-Object -First 1
          $def = Get-ChildItem $racketRoot -Recurse -File -Filter 'libracketcs*.def' | Select-Object -First 1
          foreach ($item in @($petite, $scheme, $racketBoot, $dll, $def)) {
            if (-not $item) { throw 'required Racket CS runtime file was not found' }
          }
          Copy-Item $petite.FullName (Join-Path $runtime 'petite.boot') -Force
          Copy-Item $scheme.FullName (Join-Path $runtime 'scheme.boot') -Force
          Copy-Item $racketBoot.FullName (Join-Path $runtime 'racket.boot') -Force
          Copy-Item $dll.FullName (Join-Path $stage $dll.Name) -Force

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio C++ tools were not found' }
          $libExe = Get-ChildItem (Join-Path $vsRoot 'VC\Tools\MSVC') -Recurse -File -Filter lib.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64\\lib\.exe$' } |
            Select-Object -First 1
          if (-not $libExe) { throw 'MSVC lib.exe was not found' }
          $importLib = Join-Path $stage 'libracketcs.lib'
          & $libExe.FullName "/def:$($def.FullName)" "/out:$importLib" /machine:x64
          if ($LASTEXITCODE -ne 0) { throw 'failed to create Racket import library' }

          cmake -S platform/windows/Integration -B $nativeBuild `
            "-DRIVET_ROOT=$PWD" `
            "-DRIVET_RACKET_INCLUDE=$include" `
            "-DRIVET_RACKET_IMPORT_LIB=$importLib"
          cmake --build $nativeBuild --config Release

          $integrationExe = Join-Path $nativeBuild 'Release\RivetIntegration.exe'
          if (-not (Test-Path $integrationExe)) { throw 'integration executable was not produced' }
          Copy-Item $integrationExe (Join-Path $stage 'RivetIntegration.exe') -Force
          "RIVET_ROUNDTRIP_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise embedded runtime
        timeout-minutes: 2
        shell: pwsh
        run: '& (Join-Path $env:RIVET_ROUNDTRIP_STAGE "RivetIntegration.exe")'
      - name: Record embedded benchmark (informational)
        timeout-minutes: 2
        shell: pwsh
        run: '& (Join-Path $env:RIVET_ROUNDTRIP_STAGE "RivetIntegration.exe") --benchmark'
